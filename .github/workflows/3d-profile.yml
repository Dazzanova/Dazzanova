name: 3D Profile

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          if git commit -m "chore: update 3d contribution calendar"; then
            for attempt in 1 2 3; do
              if git push; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "git push failed after 3 attempts"
                exit 1
              fi
              echo "git push failed (attempt $attempt), rebasing on origin/${GITHUB_REF_NAME} before retry..."
              if ! git pull --rebase origin "${GITHUB_REF_NAME}"; then
                echo "git pull --rebase failed; aborting any in-progress rebase"
                git rebase --abort || true
                exit 1
              fi
              echo "git push failed (attempt $attempt), retrying in 10s..."
              sleep 10
            done
          fi
