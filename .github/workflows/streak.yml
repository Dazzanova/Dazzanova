name: Update Streak

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  streak:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Generate streak SVG
        uses: zients/github-readme-streak-stats@v2
        with:
          options: user=${{ github.repository_owner }}&theme=default&disable_animations=true
          path: assets/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit streak SVG
        run: |
          git add assets/streak.svg

          if git diff --cached --quiet -- assets/streak.svg; then
            echo "No changes to streak.svg"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update streak stats"
          git push
